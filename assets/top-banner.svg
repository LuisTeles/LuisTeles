<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Luis Teles full stack developer banner</title>
  <desc id="desc">Animated top banner with moving gradients, waves, and title text.</desc>

  <defs>
    <linearGradient id="bgTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1022"/>
      <stop offset="45%" stop-color="#102448"/>
      <stop offset="100%" stop-color="#1a3b66"/>
      <animate attributeName="x2" values="1;0.8;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;0.15;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bdff2" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d6e8ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8ec5ff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bdff2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7bdff2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7bdff2" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bgTop)"/>

  <g opacity="0.28" stroke="#7bdff2" stroke-width="1.4" fill="none">
    <path d="M0 208 C180 150, 320 245, 500 205 S880 170, 1200 212">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="
        M0 208 C180 150, 320 245, 500 205 S880 170, 1200 212;
        M0 205 C180 245, 320 150, 500 198 S880 240, 1200 188;
        M0 208 C180 150, 320 245, 500 205 S880 170, 1200 212"/>
    </path>
    <path d="M0 180 C220 132, 380 215, 610 180 S940 150, 1200 188" opacity="0.6">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="
        M0 180 C220 132, 380 215, 610 180 S940 150, 1200 188;
        M0 176 C220 230, 380 130, 610 176 S940 235, 1200 170;
        M0 180 C220 132, 380 215, 610 180 S940 150, 1200 188"/>
    </path>
  </g>

  <ellipse cx="180" cy="56" rx="120" ry="24" fill="#57b3ff" opacity="0.2" filter="url(#softBlur)">
    <animate attributeName="cx" values="180;250;180" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.14;0.28;0.14" dur="4.2s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1020" cy="220" rx="130" ry="22" fill="#7bdff2" opacity="0.18" filter="url(#softBlur)">
    <animate attributeName="cx" values="1020;940;1020" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.24;0.1" dur="5.2s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(600 124)">
    <text
      text-anchor="middle"
      font-family="Consolas, Monaco, monospace"
      font-size="44"
      font-weight="700"
      letter-spacing="1.2"
      fill="url(#textGlow)">
      Luis Teles full stack developer
      <animate attributeName="opacity" values="0.88;1;0.88" dur="3.6s" repeatCount="indefinite"/>
    </text>

    <rect x="-430" y="22" width="860" height="10" rx="5" fill="#12325c"/>
    <rect x="-430" y="22" width="280" height="10" rx="5" fill="#7bdff2">
      <animate attributeName="width" values="180;780;420;280;180" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="-450" y="-40" width="28" height="88" fill="url(#scan)" opacity="0">
      <animate attributeName="x" values="-450;420" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="4.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#7bdff2" opacity="0.8">
    <circle cx="300" cy="220" r="3">
      <animate attributeName="cy" values="220;208;220" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="338" cy="236" r="2.8">
      <animate attributeName="cy" values="236;224;236" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="62" r="3.2">
      <animate attributeName="cy" values="62;50;62" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="80" r="2.5">
      <animate attributeName="cy" values="80;70;80" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
